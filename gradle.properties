# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
gtnh.settings.blowdryerTag = 0.2.2

# Human-readable mod name, available for mcmod.info population.
modName = Radial Menu

# Case-sensitive identifier string, used for mcmod.info population.
modId = radialmenu

# Root package of the mod.
modGroup = com.cultivate.radialmenu

# Use com.github.GTNewHorizons as the maven publishing group instead of modGroup.
useModGroupForPublishing = false

# Updates your build.gradle and settings.gradle automatically whenever an update is available.
autoUpdateBuildScript = false

# Version of Minecraft to target
minecraftVersion = 1.7.10

# Version of Minecraft Forge to target
forgeVersion = 10.13.4.1614

# MCP channel/mappings for dependency deobfuscation.
channel = stable
mappingsVersion = 12

# Defines other MCP mappings for dependency deobfuscation.
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

# Default username for testing the mod.
developmentEnvironmentUserName = Developer

# Modern Java syntax support: jabel = modern syntax, Java 8 bytecode (no extra runtime stubs needed).
enableModernJavaSyntax = jabel

# Inject missing generics into the decompiled MC source for a better coding experience.
enableGenericInjection = true

# Generate a Tags class holding the version (taken from the git tag).
generateGradleTokenClass = com.cultivate.radialmenu.Tags
gradleTokenVersion = VERSION

# No API package.
apiPackage =

# Makes KeyBinding.pressed/pressTime public so the keybind action can press other mods' keys.
accessTransformersFile = radialmenu_at.cfg

# No mixins and no coremod, so the settings below stay empty or off. The mod has a regular @Mod class.
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# We do not shade any dependencies.
usesShadowedDependencies = false

# Adds CurseMaven, Modrinth, and the common 1.7.10 repositories.
includeWellKnownRepositories = true

# Not published to a maven.
usesMavenPublishing = false

# Spotless enforces the GTNH code style.
disableSpotless = false
disableCheckstyle = true

# Non-GTNH properties
org.gradle.jvmargs = -Xmx2g
org.gradle.parallel = true
